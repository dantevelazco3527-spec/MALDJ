<script type="module">

    getFirestore,
    collection,
    doc,
    getDocs,
    addDoc,
    setDoc,
    deleteDoc,
    updateDoc,
    increment
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  
  // 🔧 Reemplaza esto con la configuración de TU proyecto de Firebase
  // (Firebase Console → Configuración del proyecto → Tus apps → SDK setup and configuration)
  const firebaseConfig = {
    apiKey: "AIzaSyChJtDnVOx4uym3UY-_RauJtr2WerZFK1k",
    authDomain: "maldjupdt.firebaseapp.com",
    projectId: "maldjupdt",
    storageBucket: "maldjupdt.firebasestorage.app",
    messagingSenderId: "495563109235",
    appId: "1:495563109235:web:4e5c9e72f6b11635950b06"
  };

const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const gamesCol = collection(db, "games");
  const updatesCol = collection(db, "updates");
  const suggestionsCol = collection(db, "suggestions");

</script>

<style>

  /* ─── PANTALLA DE LOGIN ─── */

  .login-box {

  .modal-overlay {

  .modal {

    border: 1px solid var(--border);

    font-size: 1.3rem;
    transition: color 0.2s;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }

  .form-label {

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .form-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);

  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }

    color: var(--muted);

  .btn-cancel:hover { border-color: var(--accent2); color: var(--text); }

  .btn-submit {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;

  }

  .btn-submit:active { transform: scale(0.97); }

  /* ─── PESTAÑA RECOMENDAR ─── */
.rec-intro {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .rec-intro strong { color: var(--accent2); }

  .rec-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--card);
    border: 1px solid var(--green);
    border-radius: 12px;
    color: #86efac;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 12px 20px;
    z-index: 9999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-color: var(--red); color: #fca5a5; }

// ─────────────────────────────────────────
let suggestions = [];

function getVoted() {
  return JSON.parse(localStorage.getItem('votedSuggestions') || '[]');
}

async function loadSuggestions() {
  const { suggestionsCol, getDocs } = window.__fb;
  try {
    const snap = await getDocs(suggestionsCol);
    suggestions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    suggestions.sort((a, b) => (b.votes || 0) - (a.votes || 0));
  } catch (err) {
    console.error(err);
    suggestions = [];
  }
  renderSuggestionsList();
}

function renderSuggestionsList() {
  const cont = document.getElementById('suggestions-list');
  const voted = getVoted();
  if (!suggestions.length) {
    cont.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🗳️</div>
      <div class="empty-text">Nadie ha postulado juegos esta semana.<br>¡Sé el primero!</div>
    </div>`;
    return;
  }
  cont.innerHTML = suggestions.map(s => `
    <div class="game-card">
      <div class="game-card-header">
        <div class="game-name">${escHtml(s.name)}</div>
        <span class="badge badge-genre">${s.votes || 0} voto${(s.votes || 0) !== 1 ? 's' : ''}</span>
      </div>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:10px">
        Postulado por: ${escHtml(s.who)}
      </div>
      <div class="form-actions">
        <button class="btn-submit" ${voted.includes(s.id) ? 'disabled' : ''} onclick="voteSuggestion('${s.id}')">
          ${voted.includes(s.id) ? 'Ya votaste ✅' : '👍 Votar'}
        </button>
      </div>
    </div>
  `).join('');
}

async function submitSuggestion() {
  const name = document.getElementById('s-name').value.trim();
  const who  = document.getElementById('s-who').value.trim();

  if (!name || !who) {
    showToast('Completa nombre y quién postula 👀', true);
    return;
  }

  const { suggestionsCol, addDoc } = window.__fb;
  try {
    await addDoc(suggestionsCol, { name, who, votes: 0 });
    document.getElementById('s-name').value = '';
    document.getElementById('s-who').value = '';
    showToast('¡Postulado! 🔥');
    loadSuggestions();
  } catch (err) {
    console.error(err);
    showToast('Error al postular el juego ⚠️', true);
  }
}

async function voteSuggestion(id) {
  const voted = getVoted();
  if (voted.includes(id)) return;
  const { suggestionsCol, doc, updateDoc, increment } = window.__fb;
  try {
    await updateDoc(doc(suggestionsCol, id), { votes: increment(1) });
    voted.push(id);
    localStorage.setItem('votedSuggestions', JSON.stringify(voted));
    loadSuggestions();
  } catch (err) {
    console.error(err);
    showToast('Error al votar ⚠️', true);
  }
}

async function resetSuggestions() {
  if (!isAdmin) {
    showToast('No tienes permisos de administrador ❌', true);
    return;
  }
  if (!confirm('¿Borrar todas las postulaciones de esta semana?')) return;
  const { suggestionsCol, getDocs, doc, deleteDoc } = window.__fb;
  try {
    const snap = await getDocs(suggestionsCol);
    for (const d of snap.docs) {
      await deleteDoc(doc(suggestionsCol, d.id));
    }
    localStorage.removeItem('votedSuggestions');
    showToast('Postulaciones reiniciadas 🔄');
    loadSuggestions();
  } catch (err) {
    console.error(err);
    showToast('Error al reiniciar postulaciones ⚠️', true);
  }
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Disparadores ocultos
// Logo del header: Ctrl+clic (compu) o mantener presionado ~1.5 s (celular)
(function() {
  const el = document.getElementById('hdr-title');
  el.style.userSelect = 'none';
  el.style.webkitUserSelect = 'none';
  el.style.webkitTouchCallout = 'none';
  const start = () => {
    clearTimeout(secretTimer);
    secretTimer = setTimeout(openSecretGate, 1500);
  };
  const stop = () => clearTimeout(secretTimer);
  // Táctil (no se cancela con el menú de mantener presionado del navegador)
  let sx = 0, sy = 0;
  el.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; start();
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (Math.abs(e.touches[0].clientX - sx) > 12 || Math.abs(e.touches[0].clientY - sy) > 12) stop();
  }, { passive: true });
  el.addEventListener('touchend', stop);
  // Ratón
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
  // Ctrl+clic (en Mac, Ctrl+clic llega como menú contextual)
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (e.ctrlKey) openSecretGate();
  });
  el.addEventListener('click', e => { if (e.ctrlKey || e.metaKey) openSecretGate(); });
})();

// Atajo extra: escribir la clave en cualquier campo de texto de la app abre el archivo directo.
document.addEventListener('input', async e => {
  const t = e.target;
  if (!t || typeof t.value !== 'string' || t.value.length < 5) return;
  if (t.id === 'gate-input' || t.id === 'pwd-input' || t.type === 'password' || t.closest('#secret-screen')) return;
  if (!window.crypto || !crypto.subtle) return;
  const tail = t.value.slice(-5);
  if (await sha256Hex(tail.toUpperCase()) === SECRET_HASH) {
    t.value = t.value.slice(0, -5);
    closeSecretGate();
    openSecret();
  }
});

async function checkSecret() {
  const val = document.getElementById('gate-input').value;
  const err = document.getElementById('gate-err');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Este navegador no permite verificar (usa https).';

  const h = await sha256Hex(val.trim().toUpperCase());
  if (h === SECRET_HASH) {
    closeSecretGate();
    openSecret();
  } else {
    err.textContent = 'ACCESO DENEGADO';
    document.getElementById('gate-input').value = '';
    setTimeout(() => { err.textContent = ''; }, 2000);
  }

function makeChips(boxId, key, options) {
  const box = document.getElementById(boxId);
  box.innerHTML = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (sel[key].has(opt) ? ' on' : '');
    b.textContent = opt;
    b.addEventListener('click', () => {
      if (sel[key].has(opt)) sel[key].delete(opt); else sel[key].add(opt);
      b.classList.toggle('on');
    });
    box.appendChild(b);
  });
}

// ── Expedientes antiguos: se normalizan al cargar para que todos se puedan ver y editar ──
function normArchive(d) {
  const arr = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
  const catNum = v => { const m = String(v).match(/[1-5]/); return m ? parseInt(m[0], 10) : null; };
  const pick = (...keys) => { for (const k of keys) if (d[k] != null) return d[k]; return null; };
  let creado = d.creado;
  if (creado && typeof creado.toDate === 'function') creado = creado.toDate().toISOString();
  if (typeof creado !== 'string') creado = '';
  return {
    ...d,
    codename: pick('codename', 'nombre', 'name', 'sujeto', 'apodo') || 'SIN NOMBRE CLAVE',
    estatus: arr(pick('estatus')),
    cats: arr(pick('cats', 'categoria', 'cat', 'nivel')).map(catNum).filter(n => n),
    senales: arr(pick('senales', 'señales')),
    vuln: arr(pick('vuln', 'vulnerabilidades')),
    cont: arr(pick('cont', 'contencion', 'contención')),
    patron: String(pick('patron', 'patrón') || ''),
    historial: String(pick('historial') || ''),
    creado
  };
}

// ── Firestore ──
function fbErrMsg(err, accion) {
  const code = (err && err.code) || '';
  if (code === 'permission-denied') return 'Firestore bloqueó el acceso 🔒 Faltan las reglas de la colección "archivos"';
  if (code === 'unavailable') return 'Sin conexión con Firebase, intenta de nuevo ⚠️';
  return 'Error al ' + accion + ' ⚠️ ' + (code || (err && err.message) || '');
}

async function loadArchive() {
  const { archiveCol, getDocs } = window.__fb;
  try {
    const snap = await getDocs(archiveCol);
    archive = snap.docs.map(d => normArchive({ id: d.id, ...d.data() }));
    archive.sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
  } catch (err) {
    console.error(err);
    showToast(fbErrMsg(err, 'cargar el archivo'), true);
    archive = [];
  }
  renderArchive();
}

async function saveArchive() {
  const codename = document.getElementById('a-name').value.trim();
  if (!codename) { showToast('Pon un nombre clave 👀', true); return; }
  if (!sel.cats.size) { showToast('Elige un nivel de amenaza 👀', true); return; }

  const data = {
    codename,
    estatus: Array.from(sel.estatus),
    cats: Array.from(sel.cats).sort(),
    senales: Array.from(sel.senales),
    vuln: Array.from(sel.vuln),
    cont: Array.from(sel.cont),
    patron: document.getElementById('a-patron').value.trim(),
    historial: document.getElementById('a-historial').value.trim(),
    actualizado: new Date().toISOString()
  };

  const { archiveCol, addDoc, doc, setDoc } = window.__fb;
  try {
    if (editingArchiveId) {
      await setDoc(doc(archiveCol, editingArchiveId), data, { merge: true });
      const i = archive.findIndex(a => a.id === editingArchiveId);
      if (i !== -1) archive[i] = { ...archive[i], ...data };
      showToast('Expediente actualizado ✅');
    } else {
      data.creado = new Date().toISOString();
      const ref = await addDoc(archiveCol, data);
      archive.unshift({ id: ref.id, ...data });
      showToast('Expediente archivado 🔴');
    }
    clearArchiveForm();
    document.getElementById('archive-form').classList.remove('open');
    renderArchive();
  } catch (err) {
    console.error(err);
    showToast(fbErrMsg(err, 'archivar'), true);
  }
}

async function deleteArchive(id) {
  if (!confirm('¿Destruir este expediente?')) return;
  const { archiveCol, doc, deleteDoc } = window.__fb;
  try {
    await deleteDoc(doc(archiveCol, id));
    archive = archive.filter(a => a.id !== id);
    if (editingArchiveId === id) clearArchiveForm();
    renderArchive();
    showToast('Expediente destruido 🗑️');
  } catch (err) {
    console.error(err);
    showToast(fbErrMsg(err, 'borrar'), true);
  }
}

// ── Render ──
function renderArchive() {
  const q = (document.getElementById('a-search').value || '').trim().toLowerCase();

    (archiveFilter === 0 || (a.cats || []).includes(archiveFilter)) &&
    (!q || (a.codename || '').toLowerCase().includes(q))
  );
  document.getElementById('archive-count').textContent =
    list.length + ' EXPEDIENTE' + (list.length !== 1 ? 'S' : '');

  const cont = document.getElementById('archive-list');

    cont.innerHTML = '<div class="sec-empty">SIN EXPEDIENTES EN ESTA CATEGORÍA.<br>Abre uno nuevo para empezar el registro.</div>';
    return;

  const tags = (arr, cls) => (arr || []).map(t => '<span class="tag ' + (cls || '') + '">' + escHtml(t) + '</span>').join('');
  const block = (title, html) => html ? '<div class="file-sec">' + title + '</div>' + html : '';

  cont.innerHTML = list.map(a => {
    const cats = a.cats || [];
    const lvl = cats.length ? Math.max.apply(null, cats) : 1;
    const catNames = cats.map(n => {
      const c = CATS.find(x => x.n === n);
      return c ? c.name : 'CATEGORÍA ' + n;
    });
    const fecha = (a.creado || '').slice(0, 10);
    return '<div class="file-card lvl' + lvl + '">' +
      '<div class="file-head"><div>' +
        '<div class="file-name">' + escHtml(a.codename) + '</div>' +
        '<div class="file-id">EXP-' + escHtml(String(a.id).slice(0, 6).toUpperCase()) + ' · ' + escHtml(fecha) + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<button class="sec-btn" onclick="editArchive(\'' + a.id + '\')">✏ EDITAR</button>' +
        '<button class="sec-btn" onclick="deleteArchive(\'' + a.id + '\')">🗑 DESTRUIR</button>' +
      '</div>' +
      '</div>' +
      '<div class="file-redact">SEXO: <span class="redact">[REDACTADO]</span> · EDAD: <span class="redact">[REDACTADO]</span> · OPERATIVO: <span class="redact">[REDACTADO]</span></div>' +
      '<div>' + tags(a.estatus, 'st') + '</div>' +
      block('NIVEL DE AMENAZA', '<div>' + tags(catNames, 'cat') + '</div>') +
      block('SEÑALES DEL PATRÓN', '<div>' + tags(a.senales) + '</div>') +
      block('PATRÓN DE OPERACIÓN', a.patron ? '<div class="file-text">' + escHtml(a.patron) + '</div>' : '') +
      block('PUNTOS DE VULNERABILIDAD', '<div>' + tags(a.vuln) + '</div>') +
      block('HISTORIAL DE DAÑO', a.historial ? '<div class="file-text">' + escHtml(a.historial) + '</div>' : '') +
      block('PROTOCOLO DE CONTENCIÓN', '<div>' + tags(a.cont) + '</div>') +
      '</div>';
  }).join('');
}
</script>
